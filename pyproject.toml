[project]
name = "shopify-to-feeds"
version = "1.0.0"
description = "Generate Google Merchant Center, Bing Shopping and Zbozi.cz product feeds from a Shopify store."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Jan Alexandr Kopřiva", email = "jan.alexandr.kopriva@gmail.com" }]
keywords = ["shopify", "product-feed", "google-merchant", "zbozi", "bing-shopping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = ["requests>=2.33.0", "fastapi>=0.115", "pydantic>=2.10", "uvicorn[standard]>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.16.1"]

[project.urls]
Homepage = "https://github.com/koprjaa/shopify-to-feeds"
Repository = "https://github.com/koprjaa/shopify-to-feeds"
Issues = "https://github.com/koprjaa/shopify-to-feeds/issues"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "C4", "RET", "PTH", "TRY", "PERF", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "TRY003",  # one exception subclass per message is ceremony
    # Each guard wraps a single request. The cost is the network call.
    "PERF203",
    # The value returned is what the log line above it just described.
    "TRY300",
    # api.py raises inside its own try so one handler records the failed state.
    "TRY301",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.uv]
package = false
