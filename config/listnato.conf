server {
    listen 80;
    server_name listnato.cz;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name listnato.cz;

    ssl_certificate /etc/letsencrypt/live/listnato.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/listnato.cz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # API endpoints
    location /feed/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Static feed files
    location /feeds/ {
        alias /var/www/listnato/static/feeds/;
        add_header Content-Type application/xml;
        add_header Cache-Control "public, max-age=3600";
        expires 1h;
    }

    access_log /var/log/nginx/listnato.access.log;
    error_log /var/log/nginx/listnato.error.log;
} 